services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pcap-backend
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: pcap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
